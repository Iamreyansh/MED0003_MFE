name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'
  AWS_REGION: ap-south-1
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Validate MFE catalog
        run: pnpm run validate:mfes
      - name: Test MFE generator
        run: pnpm --filter @medmate/create-mfe test
      - id: matrix
        name: Build e2e matrix
        run: |
          MATRIX="$(node scripts/catalog.mjs matrix)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm run typecheck

  unit:
    name: unit-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      - name: Upload coverage to S3
        if: failure() && vars.ARTIFACT_BUCKET != ''
        continue-on-error: true
        uses: ./.github/actions/s3-logs
        with:
          label: coverage
          paths: apps/*/coverage packages/*/coverage packages/tooling/*/coverage
          role-arn: ${{ secrets.AWS_CI_LOGS_ROLE_ARN }}

  e2e:
    name: e2e-${{ matrix.name }}
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.catalog.outputs.e2e_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests for ${{ matrix.name }}
        run: pnpm --filter ${{ matrix.package }} exec playwright test -c e2e/playwright.config.ts
      - name: Upload Playwright traces to S3
        if: failure() && vars.ARTIFACT_BUCKET != ''
        continue-on-error: true
        uses: ./.github/actions/s3-logs
        with:
          label: playwright-${{ matrix.name }}
          paths: apps/${{ matrix.name }}/e2e/.results apps/${{ matrix.name }}/e2e/.report
          role-arn: ${{ secrets.AWS_CI_LOGS_ROLE_ARN }}

  build:
    name: build
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Build remotes
        run: pnpm run build
      - name: Verify federation artefacts
        run: |
          set -euo pipefail
          while IFS= read -r row; do
            name="$(echo "${row}" | jq -r '.name')"
            ./scripts/release.sh verify "dist/${name}" "${name}"
          done < <(jq -c '.mfes[]' config/mfes.json)

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x scripts/*.sh

  ci-success:
    name: ci-success
    if: always()
    needs:
      [catalog, format, lint, typecheck, unit, e2e, build, security, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI gate
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "${results}" | jq -e '
            to_entries | all(.value.result == "success")
          ' >/dev/null
