name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      turbo_cache_bucket: ${{ steps.meta.outputs.turbo_cache_bucket }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate MFE catalog
        run: pnpm run validate:mfes

      - name: Resolve turbo cache bucket
        id: meta
        run: echo "turbo_cache_bucket=${{ vars.TURBO_CACHE_BUCKET }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mfe-ci-cache-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800

      - name: Pull turbo cache
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        env:
          TURBO_CACHE_BUCKET: ${{ vars.TURBO_CACHE_BUCKET }}
        run: |
          chmod +x scripts/cache-pull.sh
          ./scripts/cache-pull.sh

  format:
    name: format
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  lint:
    name: lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: typecheck
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: test
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  build:
    name: build
    needs: [format, lint, typecheck, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify federation artefacts
        run: |
          set -euo pipefail
          while IFS= read -r row; do
            path="$(echo "${row}" | jq -r '.path')"
            test -f "${path}/dist/mf-manifest.json"
            test -f "${path}/dist/remoteEntry.js"
            echo "Verified federation artefacts for ${path}"
          done < <(jq -c '.mfes[]' config/mfes.json)
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mfe-ci-cache-push-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800
      - name: Push turbo cache
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        env:
          TURBO_CACHE_BUCKET: ${{ vars.TURBO_CACHE_BUCKET }}
        run: |
          chmod +x scripts/cache-push.sh
          ./scripts/cache-push.sh
