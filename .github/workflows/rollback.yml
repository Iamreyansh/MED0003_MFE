name: Rollback MFE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging or production'
        required: true
        type: choice
        options: [staging, production]
      mfe:
        description: 'MFE name (e.g. todo)'
        required: true
        type: string
      git_sha:
        description: 'Previous release git SHA'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mfe-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ inputs.environment == 'production' && (secrets.AWS_DEPLOY_PRODUCTION_ROLE_ARN || secrets.AWS_ROLE_ARN) || (secrets.AWS_DEPLOY_STAGING_ROLE_ARN || secrets.AWS_ROLE_ARN) }}
          role-session-name: mfe-rollback-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Rollback ${{ inputs.mfe }} and smoke-test
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          ./scripts/release.sh rollback "${{ inputs.environment }}" "${{ inputs.mfe }}" "${{ inputs.git_sha }}"
          DOMAIN="$(node scripts/catalog.mjs env-domain "${{ inputs.mfe }}" "${{ inputs.environment }}")"
          ./scripts/release.sh smoke "${DOMAIN}" "${{ inputs.git_sha }}" "${{ inputs.mfe }}"
