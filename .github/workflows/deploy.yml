name: Deploy MFEs

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mfe-deploy-production
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate / lint / typecheck / coverage / build
        run: |
          set -euo pipefail
          pnpm run validate:mfes
          pnpm run lint
          pnpm run typecheck
          pnpm run test:coverage
          pnpm run build

      - name: Compute affected MFEs
        id: affected
        run: |
          set -euo pipefail
          chmod +x scripts/affected-mfes.sh
          MATRIX="$(./scripts/affected-mfes.sh HEAD~1)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Affected matrix: ${MATRIX}"

  deploy:
    name: deploy-${{ matrix.name }}
    needs: quality
    if: needs.quality.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.quality.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install and build package
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter "${{ matrix.package }}" build
          test -f "${{ matrix.path }}/dist/mf-manifest.json"

      - name: Resolve deploy targets
        id: targets
        env:
          MFE_SITES_JSON: ${{ vars.MFE_SITES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${MFE_SITES_JSON:-}" ]; then
            echo "::error::Repository variable MFE_SITES_JSON is required"
            exit 1
          fi
          NAME="${{ matrix.name }}"
          BUCKET="$(jq -r --arg n "$NAME" '.[$n].bucket_name // empty' <<<"$MFE_SITES_JSON")"
          DIST_ID="$(jq -r --arg n "$NAME" '.[$n].distribution_id // empty' <<<"$MFE_SITES_JSON")"
          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ]; then
            echo "::error::Missing Terraform outputs for MFE ${NAME}"
            exit 1
          fi
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mfe-deploy-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800

      - name: Deploy MFE
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-mfe.sh
          ./scripts/deploy-mfe.sh \
            "${{ matrix.name }}" \
            "${{ matrix.path }}/dist" \
            "${{ steps.targets.outputs.bucket }}" \
            "${{ steps.targets.outputs.distribution_id }}" \
            "${GITHUB_SHA}"

      - name: Smoke check manifest
        run: |
          set -euo pipefail
          URL="https://${{ matrix.domain }}/mf-manifest.json"
          curl -fsSL "$URL" | jq -e '.id or .name or .meta or .' >/dev/null
          echo "Manifest OK: ${URL}"
