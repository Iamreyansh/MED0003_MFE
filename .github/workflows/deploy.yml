name: Release MFEs

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: mfe-release
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'
  TF_VERSION: '1.10.5'
  AWS_REGION: ap-south-1
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      has_mfes: ${{ steps.affected.outputs.has_mfes }}
      tf_matrix: ${{ steps.tf.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - id: affected
        run: |
          set -euo pipefail
          chmod +x scripts/affected-mfes.sh
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if ! git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
            BEFORE="origin/main"
          fi
          MATRIX="$(./scripts/affected-mfes.sh "${BEFORE}")"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "${MATRIX}" = '{"include":[]}' ]; then
            echo "has_mfes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_mfes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Affected MFEs (base=${BEFORE}): ${MATRIX}"
      - id: tf
        run: |
          chmod +x scripts/tf-affected.sh
          MATRIX="$(./scripts/tf-affected.sh "${{ github.event.before || 'origin/main' }}")"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  apply-shared:
    name: apply-shared
    needs: classify
    if: needs.classify.outputs.tf_matrix != '{"include":[]}' && contains(needs.classify.outputs.tf_matrix, '"shared"')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_STAGING_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-shared-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: |
          chmod +x scripts/tf-plan.sh scripts/tf-apply.sh scripts/tf-plan-push.sh
          ./scripts/tf-plan.sh shared
          node scripts/tf-policy.mjs infra/shared/tfplan.json shared
          ./scripts/tf-plan-push.sh shared
          ./scripts/tf-apply.sh shared

  apply-staging:
    name: apply-staging
    needs: [classify, apply-shared]
    if: |
      always() &&
      needs.classify.result == 'success' &&
      (needs.apply-shared.result == 'success' || needs.apply-shared.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_STAGING_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: |
          chmod +x scripts/tf-plan.sh scripts/tf-apply.sh scripts/tf-plan-push.sh
          ./scripts/tf-plan.sh staging
          node scripts/tf-policy.mjs infra/staging/tfplan.json staging
          ./scripts/tf-plan-push.sh staging
          ./scripts/tf-apply.sh staging

  build:
    name: build-${{ matrix.name }}
    needs: [classify, apply-staging]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.classify.result == 'success' &&
      needs.apply-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: ./.github/actions/setup
      - run: pnpm --filter ${{ matrix.package }} run build
      - run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ matrix.name }}" "${GITHUB_SHA}"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ARTIFACTS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: artifacts-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          if [ -z "${ARTIFACT_BUCKET}" ]; then
            echo "::error::Repository variable ARTIFACT_BUCKET is required"
            exit 1
          fi
          chmod +x scripts/artifact-push.sh
          ./scripts/artifact-push.sh "${{ matrix.name }}"
      - id: digest
        run: echo "digest=$(cat dist/${{ matrix.name }}/digest.sha256)" >> "$GITHUB_OUTPUT"

  staging-deploy:
    name: staging-deploy-${{ matrix.name }}
    needs: [classify, build]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_STAGING_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: deploy-staging-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          chmod +x scripts/artifact-pull.sh scripts/promote-mfe.sh scripts/record-release.sh
          ./scripts/artifact-pull.sh "${{ matrix.name }}"
          ./scripts/promote-mfe.sh staging "${{ matrix.name }}" "dist/${{ matrix.name }}" "${GITHUB_SHA}"
          ./scripts/record-release.sh staging "${{ matrix.name }}" "${GITHUB_SHA}" "$(cat dist/${{ matrix.name }}/digest.sha256)"

  staging-smoke:
    name: staging-smoke-${{ matrix.name }}
    needs: [classify, staging-deploy]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.staging-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: |
          chmod +x scripts/post-deploy-smoke.sh
          ./scripts/post-deploy-smoke.sh "${{ matrix.stagingDomain }}" "${GITHUB_SHA}" "${{ matrix.name }}"

  staging-pdt:
    name: staging-pdt-${{ matrix.name }}
    needs: [classify, staging-deploy]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.staging-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: ./.github/actions/setup
      - run: |
          chmod +x scripts/post-deploy-pdt.sh
          ./scripts/post-deploy-pdt.sh "${{ matrix.name }}" "${{ matrix.stagingDomain }}"
      - name: Upload PDT traces to S3
        if: failure() && vars.ARTIFACT_BUCKET != ''
        continue-on-error: true
        uses: ./.github/actions/s3-logs
        with:
          label: pdt-${{ matrix.name }}
          paths: apps/${{ matrix.name }}/e2e/.results apps/${{ matrix.name }}/e2e/.report
          role-arn: ${{ secrets.AWS_CI_LOGS_ROLE_ARN || secrets.AWS_ARTIFACTS_ROLE_ARN }}

  staging-gate:
    name: staging-gate
    needs: [classify, staging-smoke, staging-pdt]
    if: always() && needs.classify.outputs.has_mfes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every staging smoke and PDT matrix leg
        run: |
          set -euo pipefail
          smoke='${{ needs.staging-smoke.result }}'
          pdt='${{ needs.staging-pdt.result }}'
          if [ "${smoke}" != "success" ] || [ "${pdt}" != "success" ]; then
            echo "::error::Production blocked: staging-smoke=${smoke} staging-pdt=${pdt}"
            exit 1
          fi

  apply-production:
    name: apply-production
    needs: [classify, staging-gate]
    if: |
      always() &&
      needs.staging-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_PRODUCTION_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: |
          chmod +x scripts/tf-plan.sh scripts/tf-apply.sh scripts/tf-plan-push.sh
          ./scripts/tf-plan.sh production
          node scripts/tf-policy.mjs infra/production/tfplan.json production
          ./scripts/tf-plan-push.sh production
          ./scripts/tf-apply.sh production

  production-deploy:
    name: production-deploy-${{ matrix.name }}
    needs: [classify, staging-gate, apply-production]
    if: |
      always() &&
      needs.staging-gate.result == 'success' &&
      needs.apply-production.result == 'success' &&
      needs.classify.outputs.has_mfes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_PRODUCTION_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: deploy-production-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          chmod +x scripts/artifact-pull.sh scripts/promote-mfe.sh
          ./scripts/artifact-pull.sh "${{ matrix.name }}"
          packaged="$(jq -r '.gitSha' "dist/${{ matrix.name }}/release.json")"
          digest="$(jq -r '.digest' "dist/${{ matrix.name }}/release.json")"
          if [ "${packaged}" != "${GITHUB_SHA}" ]; then
            echo "::error::Artifact SHA ${packaged} does not match ${GITHUB_SHA}"
            exit 1
          fi
          ./scripts/promote-mfe.sh production "${{ matrix.name }}" "dist/${{ matrix.name }}" "${GITHUB_SHA}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - id: smoke
        continue-on-error: true
        run: |
          chmod +x scripts/post-deploy-smoke.sh
          ./scripts/post-deploy-smoke.sh "${{ matrix.productionDomain }}" "${GITHUB_SHA}" "${{ matrix.name }}"
      - if: steps.smoke.outcome != 'success'
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          chmod +x scripts/restore-previous.sh
          ./scripts/restore-previous.sh production "${{ matrix.name }}"
          echo "::error::Production smoke failed; restored previous known-good SHA"
          exit 1
      - if: steps.smoke.outcome == 'success'
        run: |
          chmod +x scripts/record-release.sh
          ./scripts/record-release.sh production "${{ matrix.name }}" "${GITHUB_SHA}" "$(jq -r '.digest' "dist/${{ matrix.name }}/release.json")"
