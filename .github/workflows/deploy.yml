name: Release MFEs

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  deployments: write

concurrency:
  group: mfe-release
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'
  TF_VERSION: '1.10.5'
  AWS_REGION: ap-south-1
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      has_mfes: ${{ steps.affected.outputs.has_mfes }}
      tf_matrix: ${{ steps.tf.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - id: affected
        name: Classify affected MFEs
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if ! git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
            BEFORE="origin/main"
          fi
          MATRIX="$(./scripts/release.sh affected "${BEFORE}")"
          {
            echo "matrix<<EOF"
            printf '%s\n' "${MATRIX}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "${MATRIX}" = '{"include":[]}' ]; then
            echo "has_mfes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_mfes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Affected MFEs (base=${BEFORE}): ${MATRIX}"
      - id: tf
        name: Classify affected Terraform stacks
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if ! git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
            BEFORE="origin/main"
          fi
          MATRIX="$(./scripts/tf.sh affected "${BEFORE}")"
          if [ "${MATRIX}" = '{"include":[]}' ]; then
            MATRIX='{"include":[{"stack":"shared"},{"stack":"staging"},{"stack":"production"}]}'
          fi
          {
            echo "matrix<<EOF"
            printf '%s\n' "${MATRIX}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Affected Terraform stacks (base=${BEFORE}): ${MATRIX}"

  apply-shared:
    name: apply-shared
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_STAGING_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-shared-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan, policy-scan, and apply shared
        run: |
          ./scripts/tf.sh plan shared
          ./scripts/tf.sh policy infra/shared/tfplan.json shared
          ./scripts/tf.sh plan-push shared
          ./scripts/tf.sh apply shared

  apply-staging:
    name: apply-staging
    needs: [classify, apply-shared]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_STAGING_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-staging-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan, policy-scan, and apply staging
        run: |
          ./scripts/tf.sh plan staging
          ./scripts/tf.sh policy infra/staging/tfplan.json staging
          ./scripts/tf.sh plan-push staging
          ./scripts/tf.sh apply staging

  build:
    name: build-${{ matrix.name }}
    needs: [classify, apply-staging]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.classify.result == 'success' &&
      needs.apply-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Build ${{ matrix.package }}
        run: pnpm --filter ${{ matrix.package }} run build
      - name: Package ${{ matrix.name }} release
        run: ./scripts/release.sh package "${{ matrix.name }}" "${GITHUB_SHA}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ARTIFACTS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: artifacts-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload ${{ matrix.name }} artifact to S3
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          if [ -z "${ARTIFACT_BUCKET}" ]; then
            echo "::error::Repository variable ARTIFACT_BUCKET is required"
            exit 1
          fi
          ./scripts/release.sh push "${{ matrix.name }}"
      - id: digest
        name: Record ${{ matrix.name }} digest
        run: echo "digest=$(cat dist/${{ matrix.name }}/digest.sha256)" >> "$GITHUB_OUTPUT"

  staging-deploy:
    name: staging-deploy-${{ matrix.name }}
    needs: [classify, build]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_STAGING_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: deploy-staging-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Promote ${{ matrix.name }} to staging
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          ./scripts/release.sh pull "${{ matrix.name }}"
          ./scripts/release.sh promote staging "${{ matrix.name }}" "dist/${{ matrix.name }}" "${GITHUB_SHA}"
          ./scripts/release.sh record staging "${{ matrix.name }}" "${GITHUB_SHA}" "$(cat dist/${{ matrix.name }}/digest.sha256)"

  staging-smoke:
    name: staging-smoke-${{ matrix.name }}
    needs: [classify, staging-deploy]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.staging-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Smoke-test ${{ matrix.name }} on staging
        run: ./scripts/release.sh smoke "${{ matrix.stagingDomain }}" "${GITHUB_SHA}" "${{ matrix.name }}"

  staging-pdt:
    name: staging-pdt-${{ matrix.name }}
    needs: [classify, staging-deploy]
    if: |
      always() &&
      needs.classify.outputs.has_mfes == 'true' &&
      needs.staging-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node and pnpm
        uses: ./.github/actions/setup
      - name: Run PDT for ${{ matrix.name }} on staging
        run: ./scripts/release.sh pdt "${{ matrix.name }}" "${{ matrix.stagingDomain }}"
      - name: Upload PDT traces to S3
        if: failure() && vars.ARTIFACT_BUCKET != ''
        continue-on-error: true
        uses: ./.github/actions/s3-logs
        with:
          label: pdt-${{ matrix.name }}
          paths: apps/${{ matrix.name }}/e2e/.results apps/${{ matrix.name }}/e2e/.report
          role-arn: ${{ secrets.AWS_CI_LOGS_ROLE_ARN || secrets.AWS_ARTIFACTS_ROLE_ARN }}

  staging-gate:
    name: staging-gate
    needs: [classify, staging-smoke, staging-pdt]
    if: always() && needs.classify.outputs.has_mfes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every staging smoke and PDT matrix leg
        run: |
          set -euo pipefail
          smoke='${{ needs.staging-smoke.result }}'
          pdt='${{ needs.staging-pdt.result }}'
          if [ "${smoke}" != "success" ] || [ "${pdt}" != "success" ]; then
            echo "::error::Production blocked: staging-smoke=${smoke} staging-pdt=${pdt}"
            exit 1
          fi

  apply-production:
    name: apply-production
    needs: [classify, staging-gate]
    if: |
      always() &&
      needs.staging-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_PRODUCTION_ROLE_ARN || secrets.AWS_TF_ROLE_ARN }}
          role-session-name: tf-apply-production-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Plan, policy-scan, and apply production
        run: |
          ./scripts/tf.sh plan production
          ./scripts/tf.sh policy infra/production/tfplan.json production
          ./scripts/tf.sh plan-push production
          ./scripts/tf.sh apply production

  production-deploy:
    name: production-deploy-${{ matrix.name }}
    needs: [classify, staging-gate, apply-production]
    if: |
      always() &&
      needs.staging-gate.result == 'success' &&
      needs.apply-production.result == 'success' &&
      needs.classify.outputs.has_mfes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.classify.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_PRODUCTION_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          role-session-name: deploy-production-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Promote ${{ matrix.name }} to production
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          ./scripts/release.sh pull "${{ matrix.name }}"
          packaged="$(jq -r '.gitSha' "dist/${{ matrix.name }}/release.json")"
          digest="$(jq -r '.digest' "dist/${{ matrix.name }}/release.json")"
          if [ "${packaged}" != "${GITHUB_SHA}" ]; then
            echo "::error::Artifact SHA ${packaged} does not match ${GITHUB_SHA}"
            exit 1
          fi
          ./scripts/release.sh promote production "${{ matrix.name }}" "dist/${{ matrix.name }}" "${GITHUB_SHA}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - id: smoke
        name: Smoke-test ${{ matrix.name }} on production
        continue-on-error: true
        run: ./scripts/release.sh smoke "${{ matrix.productionDomain }}" "${GITHUB_SHA}" "${{ matrix.name }}"
      - name: Restore previous ${{ matrix.name }} production release
        if: steps.smoke.outcome != 'success'
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          ./scripts/release.sh restore production "${{ matrix.name }}"
          echo "::error::Production smoke failed; restored previous known-good SHA"
          exit 1
      - name: Record ${{ matrix.name }} production release
        if: steps.smoke.outcome == 'success'
        run: ./scripts/release.sh record production "${{ matrix.name }}" "${GITHUB_SHA}" "$(jq -r '.digest' "dist/${{ matrix.name }}/release.json")"
