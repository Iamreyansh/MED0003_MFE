name: Deploy MFEs

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: mfe-deploy-production
  cancel-in-progress: false

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate:mfes
      - run: pnpm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:coverage

  build:
    name: build
    needs: [format, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mfe-deploy-cache-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800
      - name: Sync turbo cache in
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        env:
          TURBO_CACHE_BUCKET: ${{ vars.TURBO_CACHE_BUCKET }}
        run: |
          chmod +x scripts/cache-pull.sh
          ./scripts/cache-pull.sh
      - run: pnpm run build
      - name: Push turbo cache
        if: ${{ vars.TURBO_CACHE_BUCKET != '' }}
        env:
          TURBO_CACHE_BUCKET: ${{ vars.TURBO_CACHE_BUCKET }}
        run: |
          chmod +x scripts/cache-push.sh
          ./scripts/cache-push.sh
      - name: Verify federation artefacts
        run: |
          set -euo pipefail
          while IFS= read -r row; do
            path="$(echo "${row}" | jq -r '.path')"
            test -f "${path}/dist/mf-manifest.json"
            test -f "${path}/dist/remoteEntry.js"
            echo "Verified federation artefacts for ${path}"
          done < <(jq -c '.mfes[]' config/mfes.json)
      - name: Upload MFE dist artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mfe-dist-${{ github.sha }}
          path: |
            packages/components/*/dist/**
          retention-days: 7
          if-no-files-found: error
      - name: Compute affected MFEs
        id: affected
        run: |
          set -euo pipefail
          chmod +x scripts/affected-mfes.sh
          BEFORE="${{ github.event.before }}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          if ! git rev-parse --verify "${BEFORE}" >/dev/null 2>&1; then
            BEFORE="origin/main"
          fi
          MATRIX="$(./scripts/affected-mfes.sh "${BEFORE}")"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Affected matrix (base=${BEFORE}): ${MATRIX}"

  deploy:
    name: deploy-${{ matrix.name }}
    needs: build
    if: needs.build.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Download MFE dist artefacts
        uses: actions/download-artifact@95815c38cf2f0121361844600f48ef7592893716 # v4.2.1
        with:
          name: mfe-dist-${{ github.sha }}
          path: .

      - name: Verify package artefact
        run: |
          set -euo pipefail
          test -f "${{ matrix.path }}/dist/mf-manifest.json"
          test -f "${{ matrix.path }}/dist/remoteEntry.js"

      - name: Resolve deploy targets
        id: targets
        env:
          MFE_SITES_JSON: ${{ vars.MFE_SITES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${MFE_SITES_JSON:-}" ]; then
            echo "::error::Repository variable MFE_SITES_JSON is required"
            exit 1
          fi
          NAME="${{ matrix.name }}"
          BUCKET="$(jq -r --arg n "$NAME" '.[$n].bucket_name // empty' <<<"$MFE_SITES_JSON")"
          DIST_ID="$(jq -r --arg n "$NAME" '.[$n].distribution_id // empty' <<<"$MFE_SITES_JSON")"
          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ]; then
            echo "::error::Missing Terraform outputs for MFE ${NAME}"
            exit 1
          fi
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: mfe-deploy-${{ matrix.name }}-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-duration-seconds: 1800

      - name: Deploy MFE
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-mfe.sh
          ./scripts/deploy-mfe.sh \
            "${{ matrix.name }}" \
            "${{ matrix.path }}/dist" \
            "${{ steps.targets.outputs.bucket }}" \
            "${{ steps.targets.outputs.distribution_id }}" \
            "${GITHUB_SHA}"

  post-deploy:
    name: post-deploy-${{ matrix.name }}
    needs: [build, deploy]
    if: needs.build.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Post-deployment smoke
        run: |
          set -euo pipefail
          chmod +x scripts/post-deploy-smoke.sh
          ./scripts/post-deploy-smoke.sh "${{ matrix.domain }}"
