name: Upload diagnostics to S3
description: Sync CI/PDT logs to the private artifact bucket. Does not use GitHub Actions artifacts.

inputs:
  label:
    description: Log label (coverage, playwright, pdt, tfplan)
    required: true
  paths:
    description: Space-separated files or directories to upload
    required: true
  role-arn:
    description: OIDC role that may write ci-logs/ or tfplans/
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.0.2
      with:
        role-to-assume: ${{ inputs.role-arn }}
        role-session-name: ci-logs-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION || 'ap-south-1' }}
        role-duration-seconds: 900

    - name: Upload to S3
      shell: bash
      env:
        ARTIFACT_BUCKET: ${{ env.ARTIFACT_BUCKET }}
      run: |
        set -euo pipefail
        chmod +x scripts/ci-log-push.sh
        # shellcheck disable=SC2086
        ./scripts/ci-log-push.sh "${{ inputs.label }}" ${{ inputs.paths }}
